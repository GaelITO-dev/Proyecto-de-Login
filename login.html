<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page d-flex align-items-center justify-content-center min-vh-100 p-3">

    <main class="card shadow-lg login-card">
        <div class="card-body p-4 p-sm-5">

            <h1 class="card-title text-center fw-bold mb-2">Login</h1>

            <form id="loginForm" novalidate>

                <div class="mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="email" aria-describedby="emailError" required>
                    <div class="invalid-feedback" id="emailError"></div>
                </div>

                <div class="mb-4">

                    <input type="password" class="form-control" id="password" name="password" placeholder="password" autocomplete="current-password" aria-describedby="passwordError" required>
                    <div class="invalid-feedback" id="passwordError"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                    Iniciar Sesión
                </button>
            </form>
            <p class="text-center mt-3 mb-0">
    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
</p>
            <div id="formMessage" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
