<!--DOCUMENTO HTML QUE SERVIRÁ PARA PRUEBA VISUAL DE LAS DIVERSAS MODIFICACIONES QUE SE LE HAGAN AL SLIDEBAR-->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidebar</title>

  <!-- Fuente para los iconos -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  
  
  <link rel="stylesheet" href="./css/sidebar.css">
</head>
<body>

  <h1>Sidebar</h1>
  <button class="btn-menu" aria-expanded="false" aria-label="Abrir menú">
    <i class="bi bi-list"></i>
  </button>

  <aside class="contenedor-principal">

    <div class="perfil">
      <div class="avatar"></div>
      <div class="perfil-info">
        <span class="nombre">Tu Nombre</span>
        <span class="cuenta">My Account</span>
      </div>
      <i class="bi bi-chevron-down"></i>
    </div>

    <span class="etiqueta">MENU</span>


    <!-- href="#" es un enlace temporal: no carga otra página, solo vuelve al inicio.
    Se reemplaza después por la ruta real que puede ser un link externo u otro documento de la carpeta 
    el enlace en home que se dirige a youtube es un ejemplo -->
    <nav class="menu">
      <a href="https://www.youtube.com"><i class="bi bi-house"></i> Home</a>
      <a href="#"><i class="bi bi-journal-plus"></i> Post</a>
      <a href="#"><i class="bi bi-envelope-fill"></i> Mensajes</a>
      <a href="#"><i class="bi bi-people"></i> Amigos</a>
      <a href="#"><i class="bi bi-tools"></i> Herramientas</a>
    </nav>

  </aside>



  <script>
    const btn = document.querySelector('.btn-menu');
    const sidebar = document.querySelector('.contenedor-principal');

    btn.addEventListener('click', () => {
      const abierto = sidebar.classList.toggle('activo');
      btn.setAttribute('aria-expanded', abierto);
    });
  </script>

</body>
</html>
