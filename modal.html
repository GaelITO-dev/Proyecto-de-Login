<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/modal.css">
    <title>Document</title>
</head>
<body>
    
    <!--============================================CREACIÓN DEL MODAL=========================================================-->
    <div class="modal" id="modalEdad">
        <div class="modal-contenido" role="dialog" aria-modal="true" aria-labelledby="edadTitulo">
            <h2 id="edadTitulo">Advertencia de edad</h2>
            <p>Debes ser mayor de 18 años para continuar.</p>
            <p id="edadmensajeAdv"></p>
            <div class="modal-botones">
                <button id="cerrarEdad">Entendido</button>
            </div>
        </div>
    </div>


    <!--Le voy a poner un boton para irlo probando-->
    <div class="modal-botones">
        <button id="boton-Modal">boton</button>
    </div>

    <script>
         /*=====================================CONFIGURACIÓN PARA el MODAL========================================*/

        //Recolectamos el modal para poder cambiarle sus propiedades y hacerlo visible, y el boton para agregarle eventos
        const modalEdad= document.getElementById("modalEdad");
        const cerrarEdad=document.getElementById("cerrarEdad");
        const edadMensaje=document.getElementById("edadmensajeAdv");
        const botonModal=document.getElementById("boton-Modal");


        //En este metodo le vamos a agregar al modal que tenemos una nueva clase, la clase "activo", y se le aplicarán las configuraciones del css
        //en las configuraciones del css del modal tenemos ".modal.activo{}" que son las nuevas configuraciones que tendrá el modal
        //esta funcion tambien la llamaremos cuando no se cumpla la validación de edad
        function mostrarModalEdad() {
            modalEdad.classList.add("activo");
        }

        //Lo mismo pero invertido, ahora le quitamos a nuestro modal la clase de activo para que deje de ser visible
        //pues la clase ".modal" aparece con una opacidad de cero
        function ocultarModalEdad() {
            modalEdad.classList.remove("activo");
        }

        function agregarMensaje(mensaje){
            edadMensaje.textContent = mensaje;
        }

        //Le agregamos un evento al boton dentro del modal, en este caso al presionar el click se llamará a la funcion para que desaparezca el modal
        //forma no tan apropiada en este caso: cerrarEdad.addEventListener("click"), evento=>{ocultarModalEdad;}

        botonModal.addEventListener("click",mostrarModalEdad);
        cerrarEdad.addEventListener("click",ocultarModalEdad);
    </script>
</body>
</html>
